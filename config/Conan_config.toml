# Enemies above 30 FPS (runtime/src/conan_time.cpp, ConanAiSpeedHook): the AI
# measures how fast a character moves from one frame's movement (distance since
# the last frame x 1 / frame time) and picks idle / walk and "stuck" from it
# (below 0.01 / 0.1 / 0.2). Made for 30 FPS: at higher frame rates a frame with
# no movement reads as standing still, the AI picks idle and the enemy stays put.
# After each measurement, the speed over the last 1/30 s or more is used instead.
[[midasm_hook]]
name = "ConanAiSpeedHook"
address = 0x82206734
registers = ["r31", "f31"]
after_instruction = true

[[midasm_hook]]
name = "ConanAiSpeedHook"
address = 0x82200450
registers = ["r31", "f24"]
after_instruction = true

[[midasm_hook]]
name = "ConanAiSpeedHook"
address = 0x8220591C
registers = ["r31", "f12"]
after_instruction = true

[[midasm_hook]]
name = "ConanAiSpeedHook"
address = 0x82209344
registers = ["r31", "f29"]
after_instruction = true

# Enemies above 30 FPS (ConanPathStepHook): the move-to action asks the
# character's path for the distance to move along it and stops the character
# (zero velocity) when that's under 0.1 - a distance that shrinks with the frame
# time, so above 30 FPS it fell under 0.1 on most frames and the enemy hardly
# moved. The limit is scaled by the frame time (0.1 at 30 FPS, as made).
[[midasm_hook]]
name = "ConanPathStepHook"
address = 0x82205F9C
registers = ["f27", "f0"]
after_instruction = true
