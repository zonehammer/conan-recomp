# XenonRecomp config for Conan (Xbox 360, TitleID 545107DA, MediaID 22465FDA)
# Paths are relative to this file. Build the `recompile` target to run it.
[main]
file_path = "../game/extracted/default.xex"
out_directory_path = "../generated/ppc"
switch_table_file_path = "Conan_switch_tables.toml"

skip_lr = false
skip_msr = false
ctr_as_local = false
xer_as_local = false
reserved_as_local = false
cr_as_local = false
non_argument_as_local = false
non_volatile_as_local = false

# Register save/restore helpers (unique byte-pattern matches in .text; see tools/find_helpers.py)
restgprlr_14_address = 0x825663B0
savegprlr_14_address = 0x82566360
restfpr_14_address   = 0x825664DC
savefpr_14_address   = 0x82566490
restvmx_14_address   = 0x82566C98
savevmx_14_address   = 0x82566A00
restvmx_64_address   = 0x82566D2C
savevmx_64_address   = 0x82566A94

# CRT setjmp/longjmp (libjpeg's error handling uses them; jmp_buf: f14-f31, r1 +144, r13-r31, cr +304, lr +308)
setjmp_address  = 0x826F3260
longjmp_address = 0x826F3010


